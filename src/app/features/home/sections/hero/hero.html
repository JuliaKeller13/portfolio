<app-section sectionId="home" class="hero-section">
  <div class="inner-container">
    <div class="photo-container">
      <div class="shape"></div>
      <img src="/imgs/juliakeller_foto.webp" width="1024" height="1342" fetchpriority="high" [attr.alt]="'HERO.PHOTO_ALT' | translate" />
    </div>
    <div class="hero-content">
      <div class="logo-icon">
        <div class="logo-container">
          <img class="logo-base" src="/icon/logo-hero-wo.svg" [attr.alt]="'HERO.LOGO_ALT' | translate" />
          <img class="logo-overlay" src="/icon/logo-hero-o.svg" [attr.alt]="'HERO.LOGO_ALT' | translate" />
        </div>
        <app-social-icons id="social-icons"></app-social-icons>
      </div>

      <h1>
        <span class="name">{{ 'HERO.NAME' | translate }}</span>
        <span class="role">{{ 'HERO.ROLE' | translate }}</span>
      </h1>
      <div class="arrow-button">
        <app-button variant="arrow-btn" (click)="scrollToAbout()"></app-button>
      </div>
    </div>
  </div>
</app-section>
